zabbix_export:
  version: '6.0'
  date: '2026-09-14T23:05:00Z'
  groups:
    - uuid: '7df96b18c230490a9a0a9e2307226338'
      name: 'RADAR-JARBIS'
  hosts:
    - host: 'RADAR-DO-JARBIS'
      name: 'RADAR-DO-JARBIS'
      description: 'Host dedicado às métricas de aplicação dos bots Amazon e Mercado Livre do Radar Jarbis.'
      groups:
        - name: 'RADAR-JARBIS'
      interfaces:
        - ip: 127.0.0.1
          port: '10050'
          type: AGENT
          main: '1'
          interface_ref: if1
      items:
        # =============================================================
        # 1. BOT AMAZON (HTTP_AGENT direto com endpoints de métricas)
        # =============================================================
        - uuid: 'b1b2c3d4e5f647890123456789abcdef'
          name: 'Amazon - Mensagens Recebidas'
          type: HTTP_AGENT
          key: radar.amazon.messages.total
          delay: 30s
          history: 30d
          trends: 365d
          value_type: FLOAT
          url: 'http://{$AMAZON_HOST}:{$AMAZON_PORT}/metrics/messages_received'
          status_codes: '200'
          timeout: 5s
          interface_ref: if1
          tags:
            - tag: Application
              value: 'Radar Jarbis - Amazon'

        - uuid: 'c1b2c3d4e5f647890123456789abcdef'
          name: 'Amazon - Ofertas Publicadas'
          type: HTTP_AGENT
          key: radar.amazon.offers.published
          delay: 30s
          history: 30d
          trends: 365d
          value_type: FLOAT
          url: 'http://{$AMAZON_HOST}:{$AMAZON_PORT}/metrics/offers_published'
          status_codes: '200'
          timeout: 5s
          interface_ref: if1
          tags:
            - tag: Application
              value: 'Radar Jarbis - Amazon'

        - uuid: 'd1b2c3d4e5f647890123456789abcdef'
          name: 'Amazon - Ofertas Filtradas'
          type: HTTP_AGENT
          key: radar.amazon.offers.filtered
          delay: 30s
          history: 30d
          trends: 365d
          value_type: FLOAT
          url: 'http://{$AMAZON_HOST}:{$AMAZON_PORT}/metrics/offers_filtered'
          status_codes: '200'
          timeout: 5s
          interface_ref: if1
          tags:
            - tag: Application
              value: 'Radar Jarbis - Amazon'

        - uuid: 'e1b2c3d4e5f647890123456789abcdef'
          name: 'Amazon - Erros Totais'
          type: HTTP_AGENT
          key: radar.amazon.errors.total
          delay: 30s
          history: 30d
          trends: 365d
          value_type: FLOAT
          url: 'http://{$AMAZON_HOST}:{$AMAZON_PORT}/metrics/errors_total'
          status_codes: '200'
          timeout: 5s
          interface_ref: if1
          tags:
            - tag: Application
              value: 'Radar Jarbis - Amazon'

        - uuid: 'f1b2c3d4e5f647890123456789abcdef'
          name: 'Amazon - Tentativas de Reconexao'
          type: HTTP_AGENT
          key: radar.amazon.reconnect.total
          delay: 30s
          history: 30d
          trends: 365d
          value_type: FLOAT
          url: 'http://{$AMAZON_HOST}:{$AMAZON_PORT}/metrics/reconnect_attempts'
          status_codes: '200'
          timeout: 5s
          interface_ref: if1
          tags:
            - tag: Application
              value: 'Radar Jarbis - Amazon'

        - uuid: 'a2b2c3d4e5f647890123456789abcdef'
          name: 'Amazon - Memoria RSS'
          type: HTTP_AGENT
          key: radar.amazon.memory.rss
          delay: 30s
          history: 30d
          trends: 365d
          value_type: UNSIGNED
          units: B
          url: 'http://{$AMAZON_HOST}:{$AMAZON_PORT}/metrics/memory_rss_bytes'
          status_codes: '200'
          timeout: 5s
          interface_ref: if1
          tags:
            - tag: Application
              value: 'Radar Jarbis - Amazon'

        # =============================================================
        # 2. BOT MERCADO LIVRE (HTTP_AGENT direto)
        # =============================================================
        - uuid: 'c2b2c3d4e5f647890123456789abcdef'
          name: 'Mercado Livre - Mensagens Recebidas'
          type: HTTP_AGENT
          key: radar.meli.messages.total
          delay: 30s
          history: 30d
          trends: 365d
          value_type: FLOAT
          url: 'http://{$MELI_HOST}:{$MELI_PORT}/metrics/messages_received'
          status_codes: '200'
          timeout: 5s
          interface_ref: if1
          tags:
            - tag: Application
              value: 'Radar Jarbis - Mercado Livre'

        - uuid: 'd2b2c3d4e5f647890123456789abcdef'
          name: 'Mercado Livre - Ofertas Publicadas'
          type: HTTP_AGENT
          key: radar.meli.offers.published
          delay: 30s
          history: 30d
          trends: 365d
          value_type: FLOAT
          url: 'http://{$MELI_HOST}:{$MELI_PORT}/metrics/offers_published'
          status_codes: '200'
          timeout: 5s
          interface_ref: if1
          tags:
            - tag: Application
              value: 'Radar Jarbis - Mercado Livre'

        - uuid: 'e2b2c3d4e5f647890123456789abcdef'
          name: 'Mercado Livre - Ofertas Filtradas'
          type: HTTP_AGENT
          key: radar.meli.offers.filtered
          delay: 30s
          history: 30d
          trends: 365d
          value_type: FLOAT
          url: 'http://{$MELI_HOST}:{$MELI_PORT}/metrics/offers_filtered'
          status_codes: '200'
          timeout: 5s
          interface_ref: if1
          tags:
            - tag: Application
              value: 'Radar Jarbis - Mercado Livre'

        - uuid: 'f2b2c3d4e5f647890123456789abcdef'
          name: 'Mercado Livre - Memoria RSS'
          type: HTTP_AGENT
          key: radar.meli.memory.rss
          delay: 30s
          history: 30d
          trends: 365d
          value_type: UNSIGNED
          units: B
          url: 'http://{$MELI_HOST}:{$MELI_PORT}/metrics/memory_rss_bytes'
          status_codes: '200'
          timeout: 5s
          interface_ref: if1
          tags:
            - tag: Application
              value: 'Radar Jarbis - Mercado Livre'

      macros:
        - macro: '{$AMAZON_HOST}'
          value: '35.226.101.128'
        - macro: '{$AMAZON_PORT}'
          value: '8000'
        - macro: '{$MELI_HOST}'
          value: '34.10.13.28'
        - macro: '{$MELI_PORT}'
          value: '8001'

      triggers:
        - uuid: 't1b2c3d4e5f647890123456789abcdef'
          expression: 'nodata(/RADAR-DO-JARBIS/radar.amazon.messages.total,3m)=1'
          name: 'Radar Jarbis - Bot Amazon Indisponível (Sem resposta na porta {$AMAZON_PORT})'
          priority: HIGH
          description: 'O endpoint de métricas do bot Amazon não respondeu nos últimos 3 minutos.'

        - uuid: 't2b2c3d4e5f647890123456789abcdef'
          expression: 'nodata(/RADAR-DO-JARBIS/radar.meli.messages.total,3m)=1'
          name: 'Radar Jarbis - Bot Mercado Livre Indisponível (Sem resposta na porta {$MELI_PORT})'
          priority: HIGH
          description: 'O endpoint de métricas do bot Mercado Livre não respondeu nos últimos 3 minutos.'
