zabbix_export:
  version: '6.0'
  date: '2026-09-14T22:20:00Z'
  groups:
    - uuid: '7df96b18c230490a9a0a9e2307226338'
      name: 'RADAR-JARBIS'
  hosts:
    - host: 'RADAR-DO-JARBIS'
      name: 'RADAR-DO-JARBIS'
      description: 'Host dedicado exclusivamente às métricas de negócio e aplicação dos bots Amazon e Mercado Livre do Radar Jarbis.'
      groups:
        - name: 'RADAR-JARBIS'
      interfaces:
        - ip: 127.0.0.1
          port: '10050'
          type: AGENT
          main: '1'
          interface_ref: if1
      items:
        # =============================================================
        # 1. BOT AMAZON — ITEM MESTRE JSON & ITENS DEPENDENTES
        # =============================================================
        - uuid: 'a1b2c3d4e5f647890123456789abcdef'
          name: 'Amazon - Raw JSON Metrics'
          type: HTTP_AGENT
          key: radar.amazon.metrics.json
          delay: 1m
          history: 1h
          trends: '0'
          value_type: TEXT
          url: 'http://{$AMAZON_HOST}:{$AMAZON_PORT}/metrics.json'
          status_codes: '200'
          timeout: 5s
          interface_ref: if1
          tags:
            - tag: Application
              value: 'Radar Jarbis - Amazon'
            - tag: Component
              value: Metrics

        - uuid: 'b1b2c3d4e5f647890123456789abcdef'
          name: 'Amazon - Mensagens Recebidas Total'
          type: DEPENDENT
          key: radar.amazon.messages_received
          delay: '0'
          history: 30d
          trends: 365d
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.messages_received
              error_handler: DISCARD_VALUE
          master_item:
            key: radar.amazon.metrics.json
          tags:
            - tag: Application
              value: 'Radar Jarbis - Amazon'

        - uuid: 'c1b2c3d4e5f647890123456789abcdef'
          name: 'Amazon - Ofertas Publicadas Total'
          type: DEPENDENT
          key: radar.amazon.offers_published
          delay: '0'
          history: 30d
          trends: 365d
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.offers_published
              error_handler: DISCARD_VALUE
          master_item:
            key: radar.amazon.metrics.json
          tags:
            - tag: Application
              value: 'Radar Jarbis - Amazon'

        - uuid: 'd1b2c3d4e5f647890123456789abcdef'
          name: 'Amazon - Ofertas Filtradas/Descartadas'
          type: DEPENDENT
          key: radar.amazon.offers_filtered
          delay: '0'
          history: 30d
          trends: 365d
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.offers_filtered
              error_handler: DISCARD_VALUE
          master_item:
            key: radar.amazon.metrics.json
          tags:
            - tag: Application
              value: 'Radar Jarbis - Amazon'

        - uuid: 'e1b2c3d4e5f647890123456789abcdef'
          name: 'Amazon - Erros Totais'
          type: DEPENDENT
          key: radar.amazon.errors_total
          delay: '0'
          history: 30d
          trends: 365d
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.errors_total
              error_handler: DISCARD_VALUE
          master_item:
            key: radar.amazon.metrics.json
          tags:
            - tag: Application
              value: 'Radar Jarbis - Amazon'

        - uuid: 'f1b2c3d4e5f647890123456789abcdef'
          name: 'Amazon - Memória RAM Residente (RSS)'
          type: DEPENDENT
          key: radar.amazon.memory_rss
          delay: '0'
          history: 7d
          trends: 90d
          units: B
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.memory_rss_bytes
              error_handler: DISCARD_VALUE
          master_item:
            key: radar.amazon.metrics.json
          tags:
            - tag: Application
              value: 'Radar Jarbis - Amazon'

        - uuid: 'a2b2c3d4e5f647890123456789abcdef'
          name: 'Amazon - Tentativas de Reconexão'
          type: DEPENDENT
          key: radar.amazon.reconnect_attempts
          delay: '0'
          history: 7d
          trends: 90d
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.reconnect_attempts
              error_handler: DISCARD_VALUE
          master_item:
            key: radar.amazon.metrics.json
          tags:
            - tag: Application
              value: 'Radar Jarbis - Amazon'

        # =============================================================
        # 2. BOT MERCADO LIVRE — ITEM MESTRE JSON & ITENS DEPENDENTES
        # =============================================================
        - uuid: 'b2b2c3d4e5f647890123456789abcdef'
          name: 'Mercado Livre - Raw JSON Metrics'
          type: HTTP_AGENT
          key: radar.meli.metrics.json
          delay: 1m
          history: 1h
          trends: '0'
          value_type: TEXT
          url: 'http://{$MELI_HOST}:{$MELI_PORT}/metrics.json'
          status_codes: '200'
          timeout: 5s
          interface_ref: if1
          tags:
            - tag: Application
              value: 'Radar Jarbis - Mercado Livre'
            - tag: Component
              value: Metrics

        - uuid: 'c2b2c3d4e5f647890123456789abcdef'
          name: 'Mercado Livre - Mensagens Recebidas Total'
          type: DEPENDENT
          key: radar.meli.messages_received
          delay: '0'
          history: 30d
          trends: 365d
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.messages_received
              error_handler: DISCARD_VALUE
          master_item:
            key: radar.meli.metrics.json
          tags:
            - tag: Application
              value: 'Radar Jarbis - Mercado Livre'

        - uuid: 'd2b2c3d4e5f647890123456789abcdef'
          name: 'Mercado Livre - Ofertas Publicadas Total'
          type: DEPENDENT
          key: radar.meli.offers_published
          delay: '0'
          history: 30d
          trends: 365d
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.offers_published
              error_handler: DISCARD_VALUE
          master_item:
            key: radar.meli.metrics.json
          tags:
            - tag: Application
              value: 'Radar Jarbis - Mercado Livre'

        - uuid: 'e2b2c3d4e5f647890123456789abcdef'
          name: 'Mercado Livre - Ofertas Filtradas/Descartadas'
          type: DEPENDENT
          key: radar.meli.offers_filtered
          delay: '0'
          history: 30d
          trends: 365d
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.offers_filtered
              error_handler: DISCARD_VALUE
          master_item:
            key: radar.meli.metrics.json
          tags:
            - tag: Application
              value: 'Radar Jarbis - Mercado Livre'

        - uuid: 'f2b2c3d4e5f647890123456789abcdef'
          name: 'Mercado Livre - Memória RAM Residente (RSS)'
          type: DEPENDENT
          key: radar.meli.memory_rss
          delay: '0'
          history: 7d
          trends: 90d
          units: B
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.memory_rss_bytes
              error_handler: DISCARD_VALUE
          master_item:
            key: radar.meli.metrics.json
          tags:
            - tag: Application
              value: 'Radar Jarbis - Mercado Livre'

      # =============================================================
      # MACROS DO HOST
      # =============================================================
      macros:
        - macro: '{$AMAZON_HOST}'
          value: '35.226.101.128'
          description: 'IP publico ou DNS da VM Amazon no GCP'
        - macro: '{$AMAZON_PORT}'
          value: '8000'
          description: 'Porta de metricas do bot Amazon'
        - macro: '{$MELI_HOST}'
          value: '34.10.13.28'
          description: 'IP publico ou DNS da VM Mercado Livre no GCP'
        - macro: '{$MELI_PORT}'
          value: '8001'
          description: 'Porta de metricas do bot Mercado Livre'

      # =============================================================
      # TRIGGERS / ALERTAS DO HOST
      # =============================================================
      triggers:
        - uuid: '1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d'
          expression: 'nodata(/RADAR-DO-JARBIS/radar.amazon.metrics.json,3m)=1'
          name: 'Radar Jarbis - Bot Amazon Indisponível (Sem resposta na porta {$AMAZON_PORT})'
          priority: HIGH
          description: 'O endpoint JSON do bot Amazon não respondeu com código 200 nos últimos 3 minutos.'

        - uuid: '2a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d'
          expression: 'nodata(/RADAR-DO-JARBIS/radar.meli.metrics.json,3m)=1'
          name: 'Radar Jarbis - Bot Mercado Livre Indisponível (Sem resposta na porta {$MELI_PORT})'
          priority: HIGH
          description: 'O endpoint JSON do bot Mercado Livre não respondeu com código 200 nos últimos 3 minutos.'
